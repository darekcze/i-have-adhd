name: DC4I upstream watch
on:
  schedule:
    - cron: '19 7 * * 2'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare upstream
        id: compare
        shell: bash
        run: |
          git remote add upstream https://github.com/ayghri/i-have-adhd.git
          git fetch upstream main
          UPSTREAM=$(git rev-parse upstream/main)
          echo "sha=$UPSTREAM" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "$UPSTREAM" HEAD; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Record review request (no auto-merge)
        if: steps.compare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.compare.outputs.sha }}
        run: |
          gh issue create --title "Review upstream i-have-adhd updates: ${SHA:0:12}" --body "Review upstream ayghri/i-have-adhd at $SHA. Integrate via PR after isolated tests, canary Mac Pro, MaxDesk, then Mac mini. Stop rollout on failure. Do not automatically overwrite the DC4I extension."
